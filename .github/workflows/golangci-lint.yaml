---
name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: OpenCHAMI/github-actions/.github/workflows/lint-go.yml@8143942058adef1ce81a96a11ae9074358df4fbd  # v3.11
    with:
      go_version_file: go.mod
      golangci-lint-version: v2.15.0

  test:
    uses: OpenCHAMI/github-actions/.github/workflows/test-go.yml@8143942058adef1ce81a96a11ae9074358df4fbd  # v3.11
    with:
      go_version_file: go.mod
      test-command: go test -race -shuffle=on -count=1 ./...
