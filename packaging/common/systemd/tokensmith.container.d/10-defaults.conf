# /usr/share/containers/systemd/tokensmith.container.d/10-defaults.conf
#
# =============================================================================
# TokenSmith - Default Quadlet Drop-In
# =============================================================================
#
# Package-supplied defaults for the tokensmith container.  Do not edit this
# file; it is replaced on upgrade.  Override any key by dropping a
# higher-numbered file (e.g. 20-site.conf) into
# /etc/containers/systemd/tokensmith.container.d/, either by hand or via one of
# the OpenCHAMI deployment meta-configuration packages.
#
# Each option lists the equivalent tokensmith command line flag, where one
# exists.  Flags are passed through Exec= in the base unit; the environment
# variables below are the supported way to set them from a drop-in.


[Container]

# -------------------------------------------------------------------------
# Volumes
# -------------------------------------------------------------------------

# Service configuration file: group-to-scope mappings, session lifetimes, and
# related policy.
Volume=/etc/openchami/configs/%N.json:/etc/%N/config.json:Z

# Persistent state: signing keys and the RFC 8693 token stores.  U remaps
# ownership to the container's user namespace.
Volume=tokensmith-data.volume:/%N/data:Z,U

# -------------------------------------------------------------------------
# Networks
# -------------------------------------------------------------------------
# Assumes a single-node deployment of the OpenCHAMI core services alongside
# TokenSmith.  The internal network carries service traffic to the issuer and
# JWKS endpoints; the JWT network reaches the upstream OIDC provider.

Network=openchami-internal.network
Network=openchami-jwt-internal.network

# All traffic is host-local; keep the host's proxy settings out of the way.
HttpProxy=false

# Needed only when a peer is addressed by a name the container network cannot
# resolve.  Set it in a site drop-in, not here.
# AddHost=demo.openchami.cluster:172.16.0.254

# -------------------------------------------------------------------------
# Identity / Server
# -------------------------------------------------------------------------

# Issuer stamped into minted tokens and advertised in the discovery document.
# Must match the URL other services use to reach TokenSmith, which validates the
# "iss" claim against it.  Required; TokenSmith exits if unset.
#
# Flag: --issuer
Environment=TOKENSMITH_ISSUER=http://tokensmith:8080

# Port the HTTP server listens on inside the container.
#
# Default: 8080
# Flag:    --port
Environment=TOKENSMITH_PORT=8080

# Cluster identifier, emitted as a claim on minted tokens.  Demo value; override
# per site.
#
# Default: "cl-F00F00F00"
# Flag:    --cluster-id
Environment=TOKENSMITH_CLUSTER_ID=demo-cluster

# OpenCHAMI instance identifier, emitted as a claim on minted tokens.  Demo
# value; override per site.
#
# Default: "oc-F00F00F00"
# Flag:    --openchami-id
Environment=TOKENSMITH_OPENCHAMI_ID=demo-openchami

# -------------------------------------------------------------------------
# Upstream OIDC
# -------------------------------------------------------------------------

# Issuer URL of the identity provider whose tokens TokenSmith exchanges for
# OpenCHAMI tokens.  Required; TokenSmith exits if unset.
#
# Flag: --oidc-issuer
Environment=TOKENSMITH_OIDC_PROVIDER=http://hydra:4444

# -------------------------------------------------------------------------
# Files / State
# -------------------------------------------------------------------------
# In-container paths, all backed by the volumes above.

# Flag: --config
Environment=TOKENSMITH_CONFIG=/etc/tokensmith/config.json

# Signing keys, generated on first start.  Must persist, or previously issued
# tokens stop validating.
#
# Flag: --key-dir
Environment=TOKENSMITH_KEY_DIR=/tokensmith/data/keys

# RFC 8693 bootstrap token store.
#
# Default: "./data/bootstrap-tokens"
# Flag:    --rfc8693-bootstrap-store
Environment=TOKENSMITH_RFC8693_BOOTSTRAP_STORE=/tokensmith/data/bootstrap

# RFC 8693 refresh token family store.
#
# Default: "./data/refresh-tokens"
# Flag:    --rfc8693-refresh-store
Environment=TOKENSMITH_RFC8693_REFRESH_STORE=/tokensmith/data/refresh

# =============================================================================
# End of defaults.
# =============================================================================
